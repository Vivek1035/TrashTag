version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trashtag-postgres
    environment:
      POSTGRES_USER: trashtag_user
      POSTGRES_PASSWORD: trashtag_password
      POSTGRES_DB: trashtag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: trashtag-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: trashtag_mongo_user
      MONGO_INITDB_ROOT_PASSWORD: trashtag_mongo_password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:

